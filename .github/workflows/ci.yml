name: CI — FlexPay Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    # Base PostgreSQL réelle, disponible pour de futurs tests
    # d'intégration - la suite actuelle (unitaires + service, avec Prisma
    # mocké) n'en a pas besoin, mais l'avoir dès maintenant en CI évite un
    # changement de configuration le jour où des tests d'intégration
    # arrivent.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flexpay
          POSTGRES_DB: flexpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:flexpay@localhost:5432/flexpay_ci?schema=public
      JWT_ACCESS_SECRET: ci_test_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_test_refresh_secret
      JWT_REFRESH_EXPIRES_IN: 30d
      JWT_ADMIN_SECRET: ci_test_admin_secret
      JWT_ADMIN_EXPIRES_IN: 8h
      OTP_LENGTH: 6
      OTP_EXPIRES_MINUTES: 5
      OTP_MAX_ATTEMPTS: 3
      MAX_FAILED_LOGIN_ATTEMPTS: 5
      ACCOUNT_LOCK_MINUTES: 15
      SMS_PROVIDER: nimba_sms
      CARD_PROVIDER: mock
      STORAGE_PROVIDER: local
      UPLOAD_DIR: ./uploads-ci

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer ClamAV (pour le test d'intégration antivirus réel)
        run: sudo apt-get update && sudo apt-get install -y clamav

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Lancer la suite de tests
        run: npm test -- --coverage

      - name: Vérifier la syntaxe de tous les fichiers JS
        run: |
          for f in $(find src scripts -name "*.js"); do
            node --check "$f" || exit 1
          done

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
